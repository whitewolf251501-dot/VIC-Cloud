<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>VIC Living Wolf 3D</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }
    #canvas-container {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
      outline: none;
    }
    #loading-hint {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #38bdf8;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.05em;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }
  </style>
</head>
<body>
  <div id="canvas-container">
    <canvas id="wolfCanvas"></canvas>
    <div id="loading-hint">INITIALIZING WOLF…</div>
  </div>

  <script src="three-bundle.js"></script>
  <script>
    (function() {
      let renderer, scene, camera, clock;
      let wolfGroup, wolfMesh;
      let keyLight, rimLight, fillLight;
      let currentState = 'idle';
      let isRunning = false;
      let baseScale = 1.0;
      let basePosY = -0.05;
      let audioLevel = 0.0;
      let touchStartX = 0, touchStartY = 0;
      let targetRotY = 0, targetRotX = 0;

      const canvas = document.getElementById('wolfCanvas');
      const loadingHint = document.getElementById('loading-hint');

      function init() {
        if (!window.THREE) {
          loadingHint.innerText = '3D ENGINE UNAVAILABLE';
          return;
        }

        const width = window.innerWidth || 300;
        const height = window.innerHeight || 300;

        scene = new THREE.Scene();
        camera = new THREE.PerspectiveCamera(40, width / height, 0.1, 100);
        camera.position.set(0, 0, 2.2);

        try {
          renderer = new THREE.WebGLRenderer({
            canvas: canvas,
            alpha: true,
            antialias: true,
            powerPreference: 'high-performance'
          });
          renderer.setSize(width, height, false);
          renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
          renderer.setClearColor(0x000000, 0);
        } catch (e) {
          loadingHint.innerText = 'WEBGL ERROR';
          return;
        }

        clock = new THREE.Clock();

        // Cyber Lighting Setup
        const ambientLight = new THREE.AmbientLight(0xffffff, 1.4);
        scene.add(ambientLight);

        keyLight = new THREE.DirectionalLight(0x38bdf8, 2.2); // Cyan Key
        keyLight.position.set(2, 2.5, 3);
        scene.add(keyLight);

        rimLight = new THREE.DirectionalLight(0xffffff, 1.3); // White Rim
        rimLight.position.set(-2, -1, -2);
        scene.add(rimLight);

        fillLight = new THREE.DirectionalLight(0xa855f7, 0.8); // Subtle Purple Fill
        fillLight.position.set(0, -2, 2);
        scene.add(fillLight);

        wolfGroup = new THREE.Group();
        scene.add(wolfGroup);

        // Load GLB
        const loader = new THREE.GLTFLoader();
        loader.load('wolf.glb', function(gltf) {
          const model = gltf.scene;
          wolfMesh = model;

          const box = new THREE.Box3().setFromObject(model);
          const size = new THREE.Vector3();
          const center = new THREE.Vector3();
          box.getSize(size);
          box.getCenter(center);

          model.position.x = -center.x;
          model.position.y = -center.y;
          model.position.z = -center.z;

          const maxDim = Math.max(size.x, size.y, size.z);
          baseScale = 1.35 / (maxDim || 1);
          wolfGroup.scale.set(baseScale, baseScale, baseScale);
          wolfGroup.position.set(0, basePosY, 0);
          wolfGroup.add(model);

          model.traverse(function(child) {
            if (child.isMesh && child.material) {
              child.material.roughness = 0.55;
              child.material.metalness = 0.25;
            }
          });

          if (loadingHint) loadingHint.style.opacity = '0';
          isRunning = true;
          animate();
          if (window.AndroidBridge && window.AndroidBridge.onModelReady) {
            window.AndroidBridge.onModelReady();
          }
        }, undefined, function(err) {
          console.error('Error loading wolf.glb:', err);
          loadingHint.innerText = 'WOLF MODEL OFFLINE';
        });

        setupTouchEvents();
      }

      function setupTouchEvents() {
        window.addEventListener('touchstart', function(e) {
          if (e.touches.length > 0) {
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
          }
        }, { passive: true });

        window.addEventListener('touchmove', function(e) {
          if (e.touches.length > 0) {
            const dx = (e.touches[0].clientX - window.innerWidth / 2) / (window.innerWidth / 2);
            const dy = (e.touches[0].clientY - window.innerHeight / 2) / (window.innerHeight / 2);
            targetRotY = Math.max(-0.6, Math.min(0.6, dx * 0.7));
            targetRotX = Math.max(-0.35, Math.min(0.35, dy * 0.5));
          }
        }, { passive: true });

        window.addEventListener('touchend', function() {
          targetRotY = 0;
          targetRotX = 0;
          if (window.AndroidBridge && window.AndroidBridge.onWolfTapped) {
            window.AndroidBridge.onWolfTapped();
          }
        });

        window.addEventListener('resize', onResize);
      }

      function onResize() {
        if (!camera || !renderer) return;
        const w = window.innerWidth;
        const h = window.innerHeight;
        camera.aspect = w / h;
        camera.updateProjectionMatrix();
        renderer.setSize(w, h, false);
      }

      function animate() {
        if (!isRunning) return;
        requestAnimationFrame(animate);

        const delta = clock.getDelta();
        const time = clock.getElapsedTime();

        // Head and neck rotation damping
        wolfGroup.rotation.y += (targetRotY - wolfGroup.rotation.y) * 0.08;
        wolfGroup.rotation.x += (targetRotX - wolfGroup.rotation.x) * 0.08;

        // Procedural organic motions
        switch (currentState) {
          case 'idle':
            // Breathing bob and chest respiration
            const breathe = Math.sin(time * 2.4) * 0.02;
            wolfGroup.position.y = basePosY + breathe;
            const chest = 1 + Math.sin(time * 2.4) * 0.012;
            wolfGroup.scale.set(baseScale * chest, baseScale, baseScale * chest);
            break;

          case 'listening':
            // Alert perk forward, cyan illumination
            wolfGroup.position.y = basePosY + 0.03 + Math.sin(time * 3.5) * 0.01;
            wolfGroup.rotation.x = -0.08;
            break;

          case 'thinking':
            // Cranial tilt and pondering wobble, purple tone
            wolfGroup.rotation.z = Math.sin(time * 1.8) * 0.06;
            wolfGroup.position.y = basePosY + Math.sin(time * 2.0) * 0.01;
            break;

          case 'speaking':
            // Jaw pulse and energetic rhythm synchronized with voice amplitude
            const speechPulse = 1 + (audioLevel * 0.25) + Math.sin(time * 10) * 0.02;
            wolfGroup.scale.set(baseScale * speechPulse, baseScale * (1 + audioLevel * 0.15), baseScale);
            wolfGroup.position.y = basePosY + Math.sin(time * 8) * 0.015;
            break;

          case 'success':
            // Energetic bounce
            wolfGroup.position.y = basePosY + Math.abs(Math.sin(time * 6)) * 0.06;
            break;

          case 'error':
            // Rapid quizzical head-shake
            wolfGroup.rotation.y = Math.sin(time * 16) * 0.12;
            break;
        }

        renderer.render(scene, camera);
      }

      // Public API invoked from Android Kotlin
      window.setWolfState = function(state) {
        currentState = state;
        if (!keyLight) return;
        switch (state) {
          case 'listening':
            keyLight.color.setHex(0x38bdf8);
            keyLight.intensity = 2.6;
            break;
          case 'thinking':
            keyLight.color.setHex(0xa855f7);
            keyLight.intensity = 2.4;
            break;
          case 'speaking':
            keyLight.color.setHex(0x38bdf8);
            keyLight.intensity = 2.8;
            break;
          case 'success':
            keyLight.color.setHex(0x10b981);
            keyLight.intensity = 2.5;
            break;
          case 'error':
            keyLight.color.setHex(0xef4444);
            keyLight.intensity = 2.5;
            break;
          case 'idle':
          default:
            keyLight.color.setHex(0x38bdf8);
            keyLight.intensity = 2.2;
            break;
        }
      };

      window.setVoiceLevel = function(level) {
        audioLevel = Math.max(0, Math.min(1.0, level));
      };

      window.addEventListener('DOMContentLoaded', init);
    })();
  </script>
</body>
</html>
